version: '3.8'

services:
  backend:
    build: ./backend
    container_name: job_automator_backend
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_SYNC=${DATABASE_URL_SYNC}
      - REDIS_URL=${REDIS_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build: ./backend
    container_name: job_automator_celery
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_SYNC=${DATABASE_URL_SYNC}
      - REDIS_URL=${REDIS_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - ./backend:/app
    # Set concurrency to 1 to limit memory usage of Playwright/Chromium on the 1GB Micro instance
    command: celery -A app.workers.celery_app:celery_app worker -l info --concurrency=1

  celery_beat:
    build: ./backend
    container_name: job_automator_beat
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_SYNC=${DATABASE_URL_SYNC}
      - REDIS_URL=${REDIS_URL}
    volumes:
      - ./backend:/app
    command: celery -A app.workers.celery_app:celery_app beat -l info

  nginx:
    image: nginx:alpine
    container_name: job_automator_nginx
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx-split.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
